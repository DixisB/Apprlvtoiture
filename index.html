<!DOCTYPE html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0B1A2F">
<meta name="description" content="Relevé de toiture : plan annoté, repères photo et planche de synthèse, hors ligne.">
<title>Relevé toiture</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B1A2F'/%3E%3Cpath d='M18 54 L50 26 L82 54 L73 54 L73 79 L27 79 L27 54 Z' fill='%23E8622C'/%3E%3Ccircle cx='50' cy='62' r='7' fill='%23F2C230'/%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230B1A2F'/%3E%3Cpath d='M18 54 L50 26 L82 54 L73 54 L73 79 L27 79 L27 54 Z' fill='%23E8622C'/%3E%3Ccircle cx='50' cy='62' r='7' fill='%23F2C230'/%3E%3C/svg%3E">
<style>
/* ============================================================
   Design tokens
   ============================================================ */
:root{
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

  --navy-900:#0B1A2F;
  --navy-800:#10233F;
  --navy-600:#22405F;
  --accent:#E8622C;
  --accent-600:#CE5322;
  --accent-soft:rgba(232,98,44,.12);
  --gold:#F2C230;
  --danger:#DC2626;
  --danger-soft:rgba(220,38,38,.1);
  --ok:#15803D;

  --bg:#F1F4F8;
  --surface:#FFFFFF;
  --surface-2:#F7F9FC;
  --border:#E1E8F0;
  --border-strong:#CBD6E2;
  --text:#0F1B2D;
  --text-2:#43536A;
  --muted:#7A889B;
  --header-bg:linear-gradient(160deg,#12294A 0%,#0B1A2F 100%);
  --header-text:#FFFFFF;
  --header-muted:#8FA9C4;
  --scrim:rgba(9,18,32,.55);

  --r-lg:16px; --r-md:12px; --r-sm:9px;
  --sh-1:0 1px 2px rgba(15,27,45,.05), 0 1px 3px rgba(15,27,45,.07);
  --sh-2:0 4px 16px rgba(15,27,45,.10);
  --sh-3:0 18px 44px rgba(9,18,32,.28);
  --safe-b:env(safe-area-inset-bottom, 0px);
  --safe-t:env(safe-area-inset-top, 0px);
  --tap:44px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A121C;
    --surface:#131F2D;
    --surface-2:#0F1B27;
    --border:#233346;
    --border-strong:#31465F;
    --text:#E9F0F8;
    --text-2:#AFC0D3;
    --muted:#7F92A8;
    --header-bg:linear-gradient(160deg,#16293F 0%,#0A121C 100%);
    --header-muted:#8AA2BC;
    --accent-soft:rgba(232,98,44,.18);
    --danger-soft:rgba(220,38,38,.16);
    --scrim:rgba(3,8,15,.7);
    --sh-1:0 1px 2px rgba(0,0,0,.3);
    --sh-2:0 6px 20px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0A121C;
  --surface:#131F2D;
  --surface-2:#0F1B27;
  --border:#233346;
  --border-strong:#31465F;
  --text:#E9F0F8;
  --text-2:#AFC0D3;
  --muted:#7F92A8;
  --header-bg:linear-gradient(160deg,#16293F 0%,#0A121C 100%);
  --header-muted:#8AA2BC;
  --accent-soft:rgba(232,98,44,.18);
  --danger-soft:rgba(220,38,38,.16);
  --scrim:rgba(3,8,15,.7);
  --sh-1:0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 6px 20px rgba(0,0,0,.35);
}

/* ============================================================
   Base
   ============================================================ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); background:var(--bg); color:var(--text);
  font-size:15px; line-height:1.45; -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{min-height:100%;display:flex;flex-direction:column}

/* ============================================================
   Header
   ============================================================ */
.hdr{
  background:var(--header-bg); color:var(--header-text);
  padding:calc(12px + var(--safe-t)) 14px 12px; position:sticky; top:0; z-index:30;
}
.hdr-row{display:flex;align-items:center;gap:10px}
.brand{
  width:36px;height:36px;border-radius:10px;flex:none;
  background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;
}
.hdr-main{flex:1;min-width:0}
.name-input{
  background:transparent;border:none;border-bottom:1.5px solid transparent;
  color:var(--header-text);font-size:17px;font-weight:650;width:100%;padding:1px 0;outline:none;
  letter-spacing:-.01em;
}
.name-input:focus{border-bottom-color:var(--accent)}
.site-input{
  background:transparent;border:none;border-bottom:1px solid transparent;
  color:var(--header-muted);font-size:12.5px;width:100%;padding:2px 0 1px;outline:none;margin-top:1px;
}
.site-input::placeholder{color:rgba(143,169,196,.65)}
.site-input:focus{border-bottom-color:rgba(255,255,255,.25)}
.hdr-btn{
  width:var(--tap);height:var(--tap);flex:none;border:none;border-radius:12px;
  background:rgba(255,255,255,.08);color:#fff;display:flex;align-items:center;justify-content:center;
}
.hdr-btn:active{background:rgba(255,255,255,.18)}
.hdr-meta{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:10px;font-size:11.5px;color:var(--header-muted);
}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;
  background:rgba(255,255,255,.07);font-variant-numeric:tabular-nums;
}
.chip b{color:#fff;font-weight:650}
.chip.warn{background:rgba(242,194,48,.2);color:#F7DC94}

/* Tabs */
.tabs{
  position:sticky;top:0;z-index:25;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;padding:6px;gap:4px;box-shadow:var(--sh-1);
}
.tab{
  flex:1;border:none;background:transparent;color:var(--muted);font-size:13.5px;font-weight:600;
  padding:9px 6px;border-radius:9px;display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .15s,color .15s;
}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.tab .count{
  font-family:var(--mono);font-size:11px;background:var(--surface-2);color:var(--text-2);
  padding:1px 6px;border-radius:999px;border:1px solid var(--border);
}
.tab[aria-selected="true"] .count{background:var(--accent);color:#fff;border-color:transparent}

main{flex:1;padding:14px 14px calc(28px + var(--safe-b));max-width:900px;width:100%;margin:0 auto}

/* ============================================================
   Generic components
   ============================================================ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:var(--tap);
  padding:11px 15px;border-radius:var(--r-md);border:1px solid transparent;
  font-size:14.5px;font-weight:620;background:var(--surface);color:var(--text);
  border-color:var(--border-strong);box-shadow:var(--sh-1);
}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.55;pointer-events:none}
.btn-primary{background:var(--accent);color:#fff;border-color:transparent}
.btn-primary:active{background:var(--accent-600)}
.btn-dark{background:var(--navy-800);color:#fff;border-color:transparent}
.btn-danger{color:var(--danger);border-color:var(--border-strong);background:var(--surface)}
.btn-ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--text-2)}
.btn-block{width:100%}
.btn-sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:var(--r-sm)}

.card{
  background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);
  box-shadow:var(--sh-1);overflow:hidden;
}
.section-title{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  margin:2px 2px 10px;font-size:12px;font-weight:700;letter-spacing:.07em;
  text-transform:uppercase;color:var(--muted);
}
.empty{
  text-align:center;padding:38px 20px;color:var(--muted);
}
.empty .ico{opacity:.65;margin-bottom:10px}
.empty h3{font-size:15px;color:var(--text);margin-bottom:4px}
.empty p{font-size:13px;max-width:34ch;margin:0 auto 14px}

/* ============================================================
   Plan view
   ============================================================ */
.drop{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  padding:52px 20px;border:2px dashed var(--border-strong);border-radius:var(--r-lg);
  background:var(--surface);text-align:center;color:var(--muted);
}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop h3{font-size:15.5px;color:var(--text)}
.drop p{font-size:13px;max-width:32ch}
.drop .btn{margin-top:8px}

.plan-wrap{position:relative;border-radius:var(--r-lg);overflow:hidden;border:1px solid var(--border);background:var(--surface);box-shadow:var(--sh-1)}
.plan-vp{
  position:relative;overflow:hidden;background:
    repeating-conic-gradient(var(--surface-2) 0% 25%, var(--surface) 0% 50%) 0 0/18px 18px;
  touch-action:none;min-height:180px;
}
.plan-vp.placing{cursor:crosshair}
.plan-inner{position:relative;transform-origin:0 0;will-change:transform}
.plan-inner img{width:100%;display:block;pointer-events:none;user-select:none}

.pin{
  position:absolute;width:26px;height:26px;border-radius:999px;background:var(--accent);
  color:#fff;font-family:var(--mono);font-weight:700;font-size:11.5px;
  border:2px solid #fff;display:flex;align-items:center;justify-content:center;
  transform:translate(-50%,-50%);transform-origin:center;
  box-shadow:0 2px 6px rgba(0,0,0,.4);
}
.pin.no-photo{background:var(--navy-600)}
.pin.active{animation:pop .9s ease-out 2}
@keyframes pop{0%{box-shadow:0 0 0 0 rgba(232,98,44,.6)}100%{box-shadow:0 0 0 14px rgba(232,98,44,0)}}

.plan-bar{
  position:absolute;top:10px;right:10px;display:flex;align-items:center;gap:2px;
  background:var(--surface);border:1px solid var(--border);border-radius:999px;
  padding:3px;box-shadow:var(--sh-2);
}
.zbtn{width:34px;height:34px;border:none;background:transparent;border-radius:999px;color:var(--text);font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center}
.zbtn:active{background:var(--surface-2)}
.zlevel{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:40px;text-align:center}

.banner{
  position:absolute;left:10px;right:10px;top:10px;z-index:6;
  background:var(--navy-900);color:#fff;border-radius:var(--r-md);padding:10px 12px;
  font-size:13px;display:flex;align-items:center;gap:9px;box-shadow:var(--sh-2);
}
.banner .dot{width:8px;height:8px;border-radius:999px;background:var(--accent);flex:none;animation:blink 1.2s infinite}
@keyframes blink{50%{opacity:.25}}

.plan-actions{display:flex;gap:9px;margin-top:12px;flex-wrap:wrap}
.plan-actions .btn{flex:1;min-width:150px}
.hint{font-size:12px;color:var(--muted);margin-top:9px;display:flex;gap:6px;align-items:flex-start}

/* ============================================================
   Pin cards
   ============================================================ */
.pin-card{margin-bottom:12px}
.pin-card.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--sh-1)}}
.pc-head{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--border);background:var(--surface-2)}
.badge{
  width:26px;height:26px;flex:none;border-radius:999px;background:var(--accent);color:#fff;
  font-family:var(--mono);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;
}
.pc-title{flex:1;min-width:0;font-size:14.5px;font-weight:620}
.pc-title span{display:block;font-size:11.5px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums}
.icon-btn{
  width:36px;height:36px;flex:none;border:none;background:transparent;border-radius:9px;
  color:var(--muted);display:flex;align-items:center;justify-content:center;
}
.icon-btn:active{background:var(--surface-2)}
.icon-btn.danger{color:var(--danger)}
.pc-body{padding:12px}
.note{
  width:100%;font-size:14.5px;padding:10px 11px;border:1px solid var(--border);border-radius:var(--r-sm);
  background:var(--surface-2);resize:none;font-family:inherit;line-height:1.4;min-height:44px;outline:none;
}
.note:focus{border-color:var(--accent);background:var(--surface)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.thumb{position:relative;aspect-ratio:1;border-radius:var(--r-sm);overflow:hidden;border:1px solid var(--border);background:var(--surface-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .rm{
  position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:999px;border:none;
  background:rgba(11,26,47,.78);color:#fff;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center;
}
.add-photo{
  aspect-ratio:1;border:2px dashed var(--border-strong);border-radius:var(--r-sm);background:transparent;
  color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10.5px;font-weight:600;
}
.add-photo:active{border-color:var(--accent);color:var(--accent)}

/* ============================================================
   Board (planche)
   ============================================================ */
.board-tools{display:flex;gap:9px;margin-bottom:12px;flex-wrap:wrap}
.board-tools .btn{flex:1;min-width:150px}
.board-scroll{overflow:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--border);border-radius:var(--r-lg);background:#fff;box-shadow:var(--sh-1)}
.board{position:relative;width:1360px;background:#fff;padding:18px;color:#0F1B2D}
.board-head{text-align:center;margin-bottom:12px}
.board-head h2{font-size:21px;color:var(--navy-800);letter-spacing:-.01em}
.board-head .meta{font-size:11.5px;color:#64748B;margin-top:3px}
.edge-row{display:flex;justify-content:center;align-items:flex-end;gap:10px;min-height:2px}
.edge-row.bottom{align-items:flex-start}
.board-mid{display:flex;align-items:center;gap:10px;margin:10px 0}
.edge-col{display:flex;flex-direction:column;justify-content:center;gap:10px;width:186px;flex:none}
.board-plan{flex:1;position:relative}
.board-plan img{width:100%;display:block;border-radius:6px}
.board-dot{position:absolute;width:15px;height:15px;border-radius:999px;background:var(--accent);border:2px solid #fff;transform:translate(-50%,-50%);box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.ph-card{width:172px;flex:none;border:2.5px solid var(--gold);border-radius:8px;background:#fff;position:relative;overflow:hidden}
.ph-card img{width:100%;height:128px;object-fit:cover;display:block}
.ph-card .num{
  position:absolute;top:5px;left:5px;width:22px;height:22px;border-radius:999px;background:var(--accent);
  color:#fff;font-size:11px;font-weight:700;font-family:var(--mono);
  display:flex;align-items:center;justify-content:center;border:2px solid #fff;
}
.ph-card .cap{font-size:9.5px;color:#334155;padding:4px 5px;line-height:1.28;height:26px;overflow:hidden}
.board-lines{position:absolute;inset:0;pointer-events:none;z-index:5}

/* ============================================================
   Overlays: sheet, dialog, lightbox, toast
   ============================================================ */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:60;display:flex;animation:fade .18s ease-out}
@keyframes fade{from{opacity:0}}
.scrim.center{align-items:center;justify-content:center;padding:18px}
.scrim.bottom{align-items:flex-end;justify-content:center}

.sheet{
  width:100%;max-width:460px;background:var(--surface);border-radius:18px 18px 0 0;
  padding:8px 8px calc(10px + var(--safe-b));box-shadow:var(--sh-3);animation:up .22s cubic-bezier(.2,.8,.3,1);
}
@keyframes up{from{transform:translateY(22px)}}
.sheet .grip{width:38px;height:4px;border-radius:999px;background:var(--border-strong);margin:6px auto 10px}
.sheet-item{
  display:flex;align-items:center;gap:12px;width:100%;border:none;background:transparent;
  padding:13px 12px;border-radius:var(--r-md);font-size:15px;text-align:left;color:var(--text);
}
.sheet-item:active{background:var(--surface-2)}
.sheet-item .ico{width:22px;flex:none;display:flex;justify-content:center;color:var(--muted)}
.sheet-item small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.sheet-item.danger,.sheet-item.danger .ico{color:var(--danger)}
.sheet-sep{height:1px;background:var(--border);margin:6px 12px}

.dialog{
  width:100%;max-width:400px;background:var(--surface);border-radius:var(--r-lg);
  padding:20px;box-shadow:var(--sh-3);animation:up .2s cubic-bezier(.2,.8,.3,1);
}
.dialog h3{font-size:17px;margin-bottom:7px}
.dialog p{font-size:14px;color:var(--text-2);line-height:1.5}
.dialog-actions{display:flex;gap:9px;margin-top:18px}
.dialog-actions .btn{flex:1}

.lightbox{position:fixed;inset:0;background:rgba(6,12,20,.94);z-index:70;display:flex;flex-direction:column}
.lightbox img{flex:1;min-height:0;object-fit:contain;width:100%;padding:14px}
.lightbox .lb-bar{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + var(--safe-t)) 14px 10px;color:#fff;font-size:13.5px}
.lightbox .lb-bar button{background:rgba(255,255,255,.12);border:none;color:#fff;border-radius:10px;width:38px;height:38px}

.toast-host{position:fixed;left:0;right:0;bottom:calc(16px + var(--safe-b));z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
.toast{
  background:var(--navy-900);color:#fff;border-radius:999px;padding:10px 16px;font-size:13.5px;
  box-shadow:var(--sh-3);max-width:100%;animation:up .2s ease-out;
}
.toast.err{background:var(--danger)}
.toast.ok{background:var(--ok)}

.export-box{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh-3)}
.export-box h3{font-size:16px;margin-bottom:4px}
.export-box p{font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.45}
.export-box img{width:100%;border:1px solid var(--border);border-radius:var(--r-sm);margin-bottom:12px;background:#fff}

/* ============================================================
   Print report
   ============================================================ */
.print-root{display:none}
@page{size:A4;margin:14mm 12mm}
@media print{
  body{background:#fff;color:#000}
  body.printing .app,body.printing .toast-host,body.printing .scrim{display:none !important}
  body.printing .print-root{display:block}
  .print-root{font-family:var(--font);color:#111}
  .pr-head{border-bottom:2px solid #10233F;padding-bottom:8px;margin-bottom:14px}
  .pr-head h1{font-size:19px;color:#10233F}
  .pr-head .meta{font-size:11px;color:#5A6672;margin-top:4px}
  .pr-plan{position:relative;border:1px solid #94A3B0;break-inside:avoid}
  .pr-plan img{width:100%;max-height:210mm;object-fit:contain;display:block}
  .pr-dot{
    position:absolute;width:6mm;height:6mm;border-radius:999px;background:#E8622C;color:#fff;border:1px solid #fff;
    transform:translate(-50%,-50%);display:flex;align-items:center;justify-content:center;
    font-family:var(--mono);font-size:9px;font-weight:700;
  }
  .pr-legend{font-size:10px;color:#5A6672;margin-top:5px;text-align:center;font-style:italic}
  .pr-pins{break-before:page}
  .pr-pin{break-inside:avoid;page-break-inside:avoid;border-top:1px solid #C9D3DC;padding:3mm 0 4mm}
  .pr-pin-head{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#10233F}
  .pr-pin-head .n{width:5mm;height:5mm;border-radius:999px;background:#E8622C;color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;font-family:var(--mono)}
  .pr-note{font-size:11px;color:#374151;margin:1.5mm 0 2mm;line-height:1.35}
  .pr-photos{display:grid;grid-template-columns:1fr 1fr;gap:3mm}
  .pr-photos img{width:100%;height:42mm;object-fit:contain;background:#F4F6F8;border:1px solid #C9D3DC}
  .pr-more{font-size:9.5px;color:#5A6672;margin-top:1.5mm}
}
</style>
</head>
<body>
<div id="app" class="app">
  <header class="hdr" id="hdr"></header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>
<div class="print-root" id="printRoot" aria-hidden="true"></div>
<div class="toast-host" id="toastHost"></div>
<noscript><p style="padding:20px">Cette application nécessite JavaScript.</p></noscript>

<script>
"use strict";
/* ============================================================
   Relevé de toiture — application hors ligne, sans dépendance.
   Données conservées dans localStorage (clé historique conservée,
   compatible avec la version d'origine sauvegardée dans legacy/).
   ============================================================ */

const STORAGE_KEY = "releve-toiture-projet";
const THEME_KEY = "releve-toiture-theme";
const PLAN_MAX_W = 1400, PLAN_Q = 0.72;
const PHOTO_MAX_W = 900, PHOTO_Q = 0.6;
const STORAGE_BUDGET = 4.6 * 1024 * 1024; // ~5 Mo de quota localStorage

/* ---------- Icônes (SVG inline) ---------- */
const ICONS = {
  house:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#E8622C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><circle cx="12" cy="14" r="2" fill="#F2C230" stroke="none"/></svg>',
  more:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.6" fill="currentColor" stroke="none"/></svg>',
  map:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>',
  pinIco:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s7-6.2 7-11a7 7 0 10-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>',
  grid:'<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  plus:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  trash:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/></svg>',
  move:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>',
  camera:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/></svg>',
  image:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.6"/><path d="M21 16l-5-5-6 6-3-3-4 4"/></svg>',
  print:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M6 15h12v6H6z"/></svg>',
  down:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M7 12l5 5 5-5M4 21h16"/></svg>',
  up:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17V4M7 9l5-5 5 5M4 21h16"/></svg>',
  reset:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.7L3 8"/><path d="M3 3v5h5"/></svg>',
  theme:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.5 1.5M17.6 17.6l1.5 1.5M19.1 4.9l-1.5 1.5M6.4 17.6l-1.5 1.5"/></svg>',
  close:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  upload:'<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M8 8l4-4 4 4"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3"/></svg>',
  info:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7.6v.4"/></svg>'
};

/* ---------- Helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const plural = (n, w, s = "s") => `${n} ${w}${n > 1 ? s : ""}`;
const today = () => new Date().toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" });

/* ---------- State ---------- */
function blankState() {
  return { projectName: "Relevé de toiture", site: "", planImage: null, pins: [] };
}
function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return blankState();
    const p = JSON.parse(raw);
    const s = Object.assign(blankState(), p);
    s.pins = Array.isArray(p.pins) ? p.pins : [];
    s.pins = s.pins.map((pin, i) => ({
      id: String(pin.id ?? Date.now() + i),
      number: i + 1,
      x: Number(pin.x) || 0,
      y: Number(pin.y) || 0,
      note: typeof pin.note === "string" ? pin.note : "",
      photos: Array.isArray(pin.photos) ? pin.photos : []
    }));
    return s;
  } catch (e) {
    return blankState();
  }
}

let state = loadState();
let view = "plan";                 // plan | pins | board
let placing = null;                // null | {mode:"new"} | {mode:"move", id}
let focusPinId = null;             // repère à mettre en évidence dans la liste
let saveError = null;
let saveTimer = null;

function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      if (saveError) { saveError = null; renderHeader(); }
    } catch (e) {
      saveError = "Stockage plein — exporte une sauvegarde puis allège les photos.";
      toast(saveError, "err", 5000);
      renderHeader();
    }
  }, 350);
}
function storageBytes() {
  try { return new Blob([JSON.stringify(state)]).size; } catch (e) { return 0; }
}
const fmtSize = b => b > 1048576 ? (b / 1048576).toFixed(1) + " Mo" : Math.round(b / 1024) + " Ko";

/* ---------- Thème ---------- */
function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
}
applyTheme((() => { try { return localStorage.getItem(THEME_KEY) || "auto"; } catch (e) { return "auto"; } })());

/* ---------- Overlays ---------- */
function toast(msg, kind = "", ms = 2600) {
  const host = $("#toastHost");
  const el = document.createElement("div");
  el.className = "toast " + kind;
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(() => el.remove(), ms);
}
function overlay(html, cls = "center") {
  const ov = document.createElement("div");
  ov.className = "scrim " + cls;
  ov.innerHTML = html;
  ov.addEventListener("click", e => { if (e.target === ov) ov.remove(); });
  document.body.appendChild(ov);
  return ov;
}
function confirmDialog({ title, message, confirmLabel = "Confirmer", danger = false }) {
  return new Promise(resolve => {
    const ov = overlay(`<div class="dialog" role="dialog" aria-modal="true">
      <h3>${esc(title)}</h3><p>${esc(message)}</p>
      <div class="dialog-actions">
        <button class="btn" data-no>Annuler</button>
        <button class="btn ${danger ? "btn-primary" : "btn-dark"}" data-yes
          ${danger ? 'style="background:var(--danger)"' : ""}>${esc(confirmLabel)}</button>
      </div></div>`);
    const done = v => { ov.remove(); resolve(v); };
    $("[data-no]", ov).onclick = () => done(false);
    $("[data-yes]", ov).onclick = () => done(true);
    ov.addEventListener("click", e => { if (e.target === ov) resolve(false); });
  });
}
function sheet(items) {
  const ov = overlay(`<div class="sheet" role="menu"><div class="grip"></div>${
    items.map((it, i) => it.sep
      ? `<div class="sheet-sep"></div>`
      : `<button class="sheet-item ${it.danger ? "danger" : ""}" data-i="${i}">
           <span class="ico">${it.icon || ""}</span>
           <span>${esc(it.label)}${it.sub ? `<small>${esc(it.sub)}</small>` : ""}</span>
         </button>`).join("")
  }</div>`, "bottom");
  $$("[data-i]", ov).forEach(btn => {
    btn.onclick = () => { ov.remove(); items[Number(btn.dataset.i)].action?.(); };
  });
  return ov;
}
function lightbox(src, caption) {
  const ov = document.createElement("div");
  ov.className = "lightbox";
  ov.innerHTML = `<div class="lb-bar"><span>${esc(caption || "")}</span>
      <button aria-label="Fermer">${ICONS.close}</button></div>
    <img src="${src}" alt="">`;
  ov.querySelector("button").onclick = () => ov.remove();
  ov.onclick = e => { if (e.target === ov || e.target.tagName === "IMG") ov.remove(); };
  document.body.appendChild(ov);
}

/* ---------- Images ---------- */
function compressImage(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(img.width * scale));
        c.height = Math.max(1, Math.round(img.height * scale));
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#fff";
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/jpeg", quality));
      };
      img.onerror = () => reject(new Error("Image illisible"));
      img.src = e.target.result;
    };
    reader.onerror = () => reject(new Error("Lecture impossible"));
    reader.readAsDataURL(file);
  });
}
function pickFiles({ multiple = false, camera = false } = {}) {
  return new Promise(resolve => {
    const input = document.createElement("input");
    input.type = "file";
    input.accept = "image/*";
    if (multiple) input.multiple = true;
    if (camera) input.capture = "environment";
    input.style.display = "none";
    document.body.appendChild(input);
    input.onchange = () => { resolve(Array.from(input.files || [])); input.remove(); };
    input.click();
  });
}
async function setPlanFromFile(file) {
  if (!file || !file.type.startsWith("image/")) return;
  try {
    state.planImage = await compressImage(file, PLAN_MAX_W, PLAN_Q);
    zoom = { s: 1, tx: 0, ty: 0 };
    save(); renderAll();
    toast("Plan importé", "ok");
  } catch (e) { toast("Import du plan impossible", "err"); }
}
async function addPhotos(pinId, camera) {
  const files = await pickFiles({ multiple: !camera, camera });
  if (!files.length) return;
  try {
    const imgs = await Promise.all(files.map(f => compressImage(f, PHOTO_MAX_W, PHOTO_Q)));
    const pin = state.pins.find(p => p.id === pinId);
    if (!pin) return;
    pin.photos.push(...imgs);
    save(); renderAll();
    toast(plural(imgs.length, "photo") + " ajoutée" + (imgs.length > 1 ? "s" : ""), "ok");
  } catch (e) { toast("Ajout de photo impossible", "err"); }
}

/* ============================================================
   Header + onglets
   ============================================================ */
function renderHeader() {
  const photos = state.pins.reduce((n, p) => n + p.photos.length, 0);
  const bytes = storageBytes();
  const full = bytes > STORAGE_BUDGET * 0.8;
  $("#hdr").innerHTML = `
    <div class="hdr-row">
      <div class="brand">${ICONS.house}</div>
      <div class="hdr-main">
        <input class="name-input" id="nameInput" value="${esc(state.projectName)}"
               placeholder="Nom du chantier" aria-label="Nom du projet">
        <input class="site-input" id="siteInput" value="${esc(state.site)}"
               placeholder="Adresse / référence (optionnel)" aria-label="Adresse du chantier">
      </div>
      <button class="hdr-btn" id="menuBtn" aria-label="Menu">${ICONS.more}</button>
    </div>
    <div class="hdr-meta">
      <span class="chip"><b>${state.pins.length}</b> repère${state.pins.length > 1 ? "s" : ""}</span>
      <span class="chip"><b>${photos}</b> photo${photos > 1 ? "s" : ""}</span>
      <span class="chip ${full ? "warn" : ""}">${full ? "⚠ " : ""}${fmtSize(bytes)} sur cet appareil</span>
    </div>
    ${saveError ? `<div class="chip warn" style="margin-top:8px">${esc(saveError)}</div>` : ""}`;

  $("#nameInput").oninput = e => { state.projectName = e.target.value; save(); };
  $("#siteInput").oninput = e => { state.site = e.target.value; save(); };
  $("#menuBtn").onclick = openMenu;
}

function renderTabs() {
  const tabs = [
    { id: "plan", label: "Plan", icon: ICONS.map },
    { id: "pins", label: "Repères", icon: ICONS.pinIco, count: state.pins.length },
    { id: "board", label: "Planche", icon: ICONS.grid }
  ];
  $("#tabs").innerHTML = tabs.map(t => `
    <button class="tab" role="tab" aria-selected="${view === t.id}" data-tab="${t.id}">
      ${t.icon}<span>${t.label}</span>
      ${t.count ? `<span class="count">${t.count}</span>` : ""}
    </button>`).join("");
  $$("[data-tab]").forEach(b => b.onclick = () => setView(b.dataset.tab));
}

function setView(v) {
  if (view === v) return;
  view = v;
  if (v !== "plan") placing = null;
  renderAll();
  window.scrollTo({ top: 0 });
}

function openMenu() {
  const themeNames = { auto: "Automatique", light: "Clair", dark: "Sombre" };
  const cur = document.documentElement.dataset.theme || "auto";
  sheet([
    { label: "Imprimer / PDF", sub: "Rapport A4 : plan + fiches repères", icon: ICONS.print, action: printReport },
    { label: state.planImage ? "Remplacer le plan" : "Importer un plan", icon: ICONS.image,
      action: async () => { const f = await pickFiles(); if (f[0]) setPlanFromFile(f[0]); } },
    { sep: true },
    { label: "Exporter la sauvegarde", sub: "Fichier .json à conserver", icon: ICONS.down, action: exportJSON },
    { label: "Importer une sauvegarde", sub: "Remplace le relevé en cours", icon: ICONS.up, action: importJSON },
    { sep: true },
    { label: "Thème : " + themeNames[cur], icon: ICONS.theme,
      action: () => { applyTheme(cur === "auto" ? "light" : cur === "light" ? "dark" : "auto"); renderAll(); } },
    { label: "Nouveau relevé", sub: "Efface le plan, les repères et les photos",
      icon: ICONS.trash, danger: true, action: resetProject }
  ]);
}

async function resetProject() {
  const ok = await confirmDialog({
    title: "Nouveau relevé ?",
    message: "Le plan, les " + plural(state.pins.length, "repère") + " et toutes les photos seront définitivement effacés de cet appareil.",
    confirmLabel: "Tout effacer", danger: true
  });
  if (!ok) return;
  state = blankState();
  zoom = { s: 1, tx: 0, ty: 0 };
  placing = null; view = "plan";
  save(); renderAll();
  toast("Relevé réinitialisé");
}

/* ============================================================
   Vue Plan — zoom / déplacement / pose de repères
   ============================================================ */
let zoom = { s: 1, tx: 0, ty: 0 };
const MIN_S = 1, MAX_S = 8;

function applyZoom() {
  const inner = $("#planInner"), vp = $("#planVp");
  if (!inner || !vp) return;
  const vw = vp.clientWidth, vh = vp.clientHeight;
  const cw = inner.offsetWidth * zoom.s, ch = inner.offsetHeight * zoom.s;
  zoom.tx = cw <= vw ? (vw - cw) / 2 : Math.min(0, Math.max(vw - cw, zoom.tx));
  zoom.ty = ch <= vh ? (vh - ch) / 2 : Math.min(0, Math.max(vh - ch, zoom.ty));
  inner.style.transform = `translate(${zoom.tx}px, ${zoom.ty}px) scale(${zoom.s})`;
  $$(".pin", inner).forEach(m => { m.style.transform = `translate(-50%,-50%) scale(${1 / zoom.s})`; });
  const lbl = $("#zLevel");
  if (lbl) lbl.textContent = Math.round(zoom.s * 100) + "%";
}
function zoomAt(newS, cx, cy) {
  const vp = $("#planVp");
  if (!vp) return;
  const r = vp.getBoundingClientRect();
  const px = cx - r.left, py = cy - r.top;
  const s = Math.max(MIN_S, Math.min(MAX_S, newS));
  zoom.tx = px - ((px - zoom.tx) / zoom.s) * s;
  zoom.ty = py - ((py - zoom.ty) / zoom.s) * s;
  zoom.s = s;
  applyZoom();
}

function planCoords(clientX, clientY) {
  const img = $("#planImg");
  if (!img) return null;
  const r = img.getBoundingClientRect();
  const x = ((clientX - r.left) / r.width) * 100;
  const y = ((clientY - r.top) / r.height) * 100;
  if (x < 0 || x > 100 || y < 0 || y > 100) return null;
  return { x, y };
}
function handlePlanTap(clientX, clientY) {
  const c = planCoords(clientX, clientY);
  if (!c) return;
  if (placing.mode === "move") {
    const pin = state.pins.find(p => p.id === placing.id);
    if (pin) { pin.x = c.x; pin.y = c.y; }
    placing = null;
    save(); renderAll();
    toast("Repère déplacé", "ok");
    return;
  }
  const id = String(Date.now());
  state.pins.push({ id, number: state.pins.length + 1, x: c.x, y: c.y, note: "", photos: [] });
  placing = null;
  focusPinId = id;
  save();
  view = "pins";
  renderAll();
  toast("Repère " + state.pins.length + " créé — ajoute une photo");
}

function setupPlanInteraction(vp) {
  const img = $("#planImg");
  if (img && !img.complete) img.onload = applyZoom;
  requestAnimationFrame(applyZoom);

  $("#zIn").onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(zoom.s * 1.5, r.left + r.width / 2, r.top + r.height / 2); };
  $("#zOut").onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(zoom.s / 1.5, r.left + r.width / 2, r.top + r.height / 2); };
  $("#zReset").onclick = () => { zoom = { s: 1, tx: 0, ty: 0 }; applyZoom(); };

  const pts = new Map();
  let startDist = 0, startS = 1, startMid = null, panStart = null, moved = 0;

  vp.addEventListener("pointerdown", e => {
    if (e.target.closest(".plan-bar")) return; // laisser les boutons de zoom recevoir le clic
    vp.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = 0;
    if (pts.size === 1) {
      panStart = { x: e.clientX, y: e.clientY, tx: zoom.tx, ty: zoom.ty };
    } else if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      startDist = Math.hypot(a.x - b.x, a.y - b.y);
      startS = zoom.s;
      startMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      panStart = null;
    }
  });
  vp.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && startDist) {
      const [a, b] = [...pts.values()];
      moved = 99;
      zoomAt(startS * (Math.hypot(a.x - b.x, a.y - b.y) / startDist), startMid.x, startMid.y);
    } else if (pts.size === 1 && panStart && zoom.s > 1) {
      const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
      moved = Math.max(moved, Math.hypot(dx, dy));
      zoom.tx = panStart.tx + dx;
      zoom.ty = panStart.ty + dy;
      applyZoom();
    }
  });
  const end = e => {
    const wasSingle = pts.size === 1;
    pts.delete(e.pointerId);
    if (pts.size) return;
    if (wasSingle && moved < 8) {
      if (placing) {
        handlePlanTap(e.clientX, e.clientY);
      } else {
        // le viewport capture le pointeur : on retrouve le repère par ses coordonnées
        const marker = document.elementFromPoint(e.clientX, e.clientY)?.closest("[data-pin]");
        if (marker) openPin(marker.dataset.pin);
      }
    }
    panStart = null; startDist = 0;
  };
  vp.addEventListener("pointerup", end);
  vp.addEventListener("pointercancel", e => { pts.delete(e.pointerId); panStart = null; startDist = 0; });
  vp.addEventListener("wheel", e => {
    e.preventDefault();
    zoomAt(zoom.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY);
  }, { passive: false });
}

function openPin(id) {
  focusPinId = id;
  view = "pins";
  renderAll();
}

function renderPlanView() {
  const main = $("#view");
  if (!state.planImage) {
    main.innerHTML = `
      <div class="drop" id="drop">
        <span class="ico">${ICONS.upload}</span>
        <h3>Importer le plan de toiture</h3>

function assignEdges() {
  const withPhoto = state.pins.filter(p => p.photos.length > 0);
  const edges = { top: [], bottom: [], left: [], right: [] };
  const cap = { top: 7, bottom: 7, left: 4, right: 4 };
  withPhoto.forEach(p => {
    const d = { top: p.y, bottom: 100 - p.y, left: p.x, right: 100 - p.x };
    const order = Object.keys(d).sort((a, b) => d[a] - d[b]);
    const target = order.find(e => edges[e].length < cap[e]) || order[0];
    edges[target].push(p);
  });
  edges.top.sort((a, b) => a.x - b.x);
  edges.bottom.sort((a, b) => a.x - b.x);
  edges.left.sort((a, b) => a.y - b.y);
  edges.right.sort((a, b) => a.y - b.y);
  return edges;
}

/* Géométrie partagée entre le rendu SVG et l'export canvas. */
function connectorGeometry(cardRect, planRect, pin, originX, originY) {
  const tx = planRect.left - originX + (pin.x / 100) * planRect.width;
  const ty = planRect.top - originY + (pin.y / 100) * planRect.height;
  const cx = cardRect.left - originX + cardRect.width / 2;
  const cy = cardRect.top - originY + cardRect.height / 2;
  let sx, sy;
  if (cardRect.bottom <= planRect.top + 2) { sx = cx; sy = cardRect.bottom - originY; }
  else if (cardRect.top >= planRect.bottom - 2) { sx = cx; sy = cardRect.top - originY; }
  else if (cardRect.right <= planRect.left + 2) { sx = cardRect.right - originX; sy = cy; }
  else { sx = cardRect.left - originX; sy = cy; }
  const mx = (sx + tx) / 2, my = (sy + ty) / 2;
  const nx = -(ty - sy), ny = tx - sx;
  const len = Math.hypot(nx, ny) || 1;
  const bow = Math.min(38, len * 0.12);
  return { sx, sy, tx, ty, qx: mx + (nx / len) * bow, qy: my + (ny / len) * bow };
}

function drawLines() {
  const board = $("#board"), svg = $("#boardLines"), plan = $("#boardImg");
  if (!board || !svg || !plan) return;
  const br = board.getBoundingClientRect(), pr = plan.getBoundingClientRect();
  svg.setAttribute("viewBox", `0 0 ${br.width} ${br.height}`);
  svg.setAttribute("width", br.width);
  svg.setAttribute("height", br.height);

  let out = `<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto">
    <polygon points="0 0, 7 3.5, 0 7" fill="#F2C230" stroke="#8A6D00" stroke-width="0.5"/></marker></defs>`;
  $$("[data-card]").forEach(card => {
    const pin = state.pins.find(p => p.id === card.dataset.card);
    if (!pin) return;
    const g = connectorGeometry(card.getBoundingClientRect(), pr, pin, br.left, br.top);
    out += `<path d="M ${g.sx} ${g.sy} Q ${g.qx} ${g.qy} ${g.tx} ${g.ty}" fill="none"
      stroke="#F2C230" stroke-width="4" stroke-linecap="round" marker-end="url(#ah)" opacity=".95"/>`;
  });
  svg.innerHTML = out;
}

function loadImg(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = () => rej(new Error("Image illisible"));
    i.src = src;
  });
}
function drawCover(ctx, img, x, y, w, h) {
  const ar = img.width / img.height, dr = w / h;
  let sw, sh, sx, sy;
  if (ar > dr) { sh = img.height; sw = sh * dr; sx = (img.width - sw) / 2; sy = 0; }
  else { sw = img.width; sh = sw / dr; sx = 0; sy = (img.height - sh) / 2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}
function roundRectPath(ctx, x, y, w, h, r) {
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}
function wrapText(ctx, text, maxW, maxLines) {
  const words = String(text).split(/\s+/);
  const lines = [];
  let cur = "";
  for (const w of words) {
    const t = cur ? cur + " " + w : w;
    if (ctx.measureText(t).width > maxW && cur) {
      lines.push(cur); cur = w;
      if (lines.length === maxLines) break;
    } else cur = t;
  }
  if (lines.length < maxLines && cur) lines.push(cur);
  if (lines.length === maxLines && ctx.measureText(lines[maxLines - 1]).width > maxW) {
    let last = lines[maxLines - 1];
    while (last.length > 3 && ctx.measureText(last + "…").width > maxW) last = last.slice(0, -1);
    lines[maxLines - 1] = last + "…";
  }
  return lines;
}

async function exportPNG() {
  const btn = $("#exportPng"), board = $("#board"), planEl = $("#boardImg");
  if (!board || !planEl) return;
  const label = btn.innerHTML;
  btn.disabled = true;
  btn.textContent = "Génération…";
  try {
    const S = 2;
    const br = board.getBoundingClientRect();
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(br.width * S);
    canvas.height = Math.round(br.height * S);
    const ctx = canvas.getContext("2d");
    ctx.scale(S, S);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, br.width, br.height);
    ctx.textBaseline = "top";

    // En-tête
    const head = board.querySelector(".board-head");
    const withPhoto = state.pins.filter(p => p.photos.length);
    if (head) {
      const hr = head.getBoundingClientRect();
      ctx.textAlign = "center";
      ctx.fillStyle = "#10233F";
      ctx.font = '700 21px -apple-system, Helvetica, Arial, sans-serif';
      ctx.fillText(state.projectName, br.width / 2, hr.top - br.top);
      ctx.fillStyle = "#64748B";
      ctx.font = '11.5px -apple-system, Helvetica, Arial, sans-serif';
      const meta = (state.site ? state.site + " · " : "") +
        `Relevé de toiture · ${plural(withPhoto.length, "désordre")} localisé${withPhoto.length > 1 ? "s" : ""} · ${today()}`;
      ctx.fillText(meta, br.width / 2, hr.top - br.top + 28);
      ctx.textAlign = "left";
    }

    // Plan
    const pr = planEl.getBoundingClientRect();
    const planImg = await loadImg(state.planImage);
    ctx.save();
    roundRectPath(ctx, pr.left - br.left, pr.top - br.top, pr.width, pr.height, 6);
    ctx.clip();
    ctx.drawImage(planImg, pr.left - br.left, pr.top - br.top, pr.width, pr.height);
    ctx.restore();
    ctx.strokeStyle = "#94A3B0";
    ctx.lineWidth = 1;
    roundRectPath(ctx, pr.left - br.left, pr.top - br.top, pr.width, pr.height, 6);
    ctx.stroke();

    // Vignettes photo
    const cards = $$("[data-card]");
    for (const card of cards) {
      const pin = state.pins.find(p => p.id === card.dataset.card);
      if (!pin) continue;
      const cr = card.getBoundingClientRect();
      const x = cr.left - br.left, y = cr.top - br.top;
      ctx.fillStyle = "#ffffff";
      roundRectPath(ctx, x, y, cr.width, cr.height, 8);
      ctx.fill();

      const imgEl = card.querySelector("img");
      const ir = imgEl.getBoundingClientRect();
      ctx.save();
      roundRectPath(ctx, x + 2, y + 2, cr.width - 4, cr.height - 4, 6);
      ctx.clip();
      drawCover(ctx, await loadImg(pin.photos[0]), ir.left - br.left, ir.top - br.top, ir.width, ir.height);
      ctx.restore();

      const capEl = card.querySelector(".cap");
      if (capEl) {
        const car = capEl.getBoundingClientRect();
        ctx.fillStyle = "#334155";
        ctx.font = '10px -apple-system, Helvetica, Arial, sans-serif';
        wrapText(ctx, boardCaption(pin), cr.width - 12, 2)
          .forEach((l, i) => ctx.fillText(l, car.left - br.left + 5, car.top - br.top + 3 + i * 12));
      }
      ctx.strokeStyle = "#F2C230";
      ctx.lineWidth = 2.5;
      roundRectPath(ctx, x + 1.25, y + 1.25, cr.width - 2.5, cr.height - 2.5, 7);
      ctx.stroke();
    }

    // Connecteurs
    ctx.lineCap = "round";
    for (const card of cards) {
      const pin = state.pins.find(p => p.id === card.dataset.card);
      if (!pin) continue;
      const g = connectorGeometry(card.getBoundingClientRect(), pr, pin, br.left, br.top);
      ctx.strokeStyle = "#F2C230";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(g.sx, g.sy);
      ctx.quadraticCurveTo(g.qx, g.qy, g.tx, g.ty);
      ctx.stroke();
      // pointe de flèche calquée sur le marqueur SVG de la planche à l'écran
      const ang = Math.atan2(g.ty - g.qy, g.tx - g.qx);
      const HEAD = 22, HALF = 10;
      const bx = g.tx - HEAD * Math.cos(ang), by = g.ty - HEAD * Math.sin(ang);
      ctx.beginPath();
      ctx.moveTo(g.tx, g.ty);
      ctx.lineTo(bx + HALF * Math.sin(ang), by - HALF * Math.cos(ang));
      ctx.lineTo(bx - HALF * Math.sin(ang), by + HALF * Math.cos(ang));
      ctx.closePath();
      ctx.fillStyle = "#F2C230";
      ctx.fill();
      ctx.strokeStyle = "#8A6D00";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    // Points sur le plan
    for (const pin of state.pins) {
      const dx = pr.left - br.left + (pin.x / 100) * pr.width;
      const dy = pr.top - br.top + (pin.y / 100) * pr.height;
      ctx.beginPath();
      ctx.arc(dx, dy, 7, 0, Math.PI * 2);
      ctx.fillStyle = "#E8622C";
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    // Numéros des vignettes
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const card of cards) {
      const pin = state.pins.find(p => p.id === card.dataset.card);
      if (!pin) continue;
      const numEl = card.querySelector(".num");
      const nr = numEl.getBoundingClientRect();
      const bx = nr.left - br.left + nr.width / 2, by = nr.top - br.top + nr.height / 2;
      ctx.beginPath();
      ctx.arc(bx, by, 11, 0, Math.PI * 2);
      ctx.fillStyle = "#E8622C";
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.font = '700 12px ui-monospace, Menlo, monospace';
      ctx.fillText(String(pin.number), bx, by + 0.5);
    }
    ctx.textAlign = "left";
    ctx.textBaseline = "top";

    showExport(canvas.toDataURL("image/png"));
  } catch (e) {
    toast("Échec de la génération : " + e.message, "err", 4000);
  } finally {
    btn.disabled = false;
    btn.innerHTML = label;
  }
}

function fileBase() {
  return ((state.projectName || "planche").normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^\w\-]+/g, "_").replace(/^_+|_+$/g, "") || "planche");
}
function showExport(url) {
  const ov = overlay(`<div class="export-box">
      <h3>Planche générée</h3>
      <p>Appui long sur l'image → « Ajouter aux photos », ou enregistre le fichier.</p>
      <img src="${url}" alt="Aperçu de la planche">

         style="text-decoration:none">${ICONS.down} Enregistrer le fichier</a>
      <button class="btn btn-block btn-ghost" data-close style="margin-top:8px">Fermer</button>
    </div>`);
  $("[data-close]", ov).onclick = () => ov.remove();
}

/* ============================================================
   Sauvegarde JSON
   ============================================================ */
function download(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function exportJSON() {
  const payload = { app: "releve-toiture", version: 6, exportedAt: new Date().toISOString(), data: state };
  download(new Blob([JSON.stringify(payload)], { type: "application/json" }), fileBase() + ".json");
  toast("Sauvegarde exportée", "ok");
}
async function importJSON() {
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "application/json,.json";
  input.style.display = "none";
  document.body.appendChild(input);
  input.onchange = async () => {
    const file = input.files?.[0];
    input.remove();
    if (!file) return;
    try {
      const parsed = JSON.parse(await file.text());
      const data = parsed && parsed.data ? parsed.data : parsed;
      if (!data || typeof data !== "object" || !Array.isArray(data.pins)) throw new Error("format");
      const ok = await confirmDialog({
        title: "Importer cette sauvegarde ?",
        message: `« ${data.projectName || "Sans nom"} » — ${plural((data.pins || []).length, "repère")}. Le relevé actuellement ouvert sera remplacé.`,
        confirmLabel: "Importer", danger: true
      });
      if (!ok) return;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      state = loadState();
      zoom = { s: 1, tx: 0, ty: 0 };
      placing = null; view = "plan";
      renderAll();
      toast("Sauvegarde importée", "ok");
    } catch (e) {
      toast("Fichier de sauvegarde invalide", "err");
    }
  };
  input.click();
}

/* ============================================================
   Rapport imprimable A4
   ============================================================ */
function printReport() {
  if (!state.pins.length && !state.planImage) { toast("Rien à imprimer pour l'instant", "err"); return; }
  const root = $("#printRoot");
  const dots = state.pins.map(p =>
    `<div class="pr-dot" style="left:${p.x}%;top:${p.y}%">${p.number}</div>`).join("");
  root.innerHTML = `
    <div class="pr-head">
      <h1>${esc(state.projectName)}</h1>
      <div class="meta">${state.site ? esc(state.site) + " · " : ""}Rapport photo · ${
        plural(state.pins.length, "repère")} · ${today()}</div>
    </div>
    ${state.planImage ? `<div class="pr-plan"><img src="${state.planImage}" alt="Plan">${dots}</div>
      <div class="pr-legend">Plan de toiture — localisation des désordres relevés</div>` : ""}
    ${state.pins.length ? `<div class="pr-pins">${state.pins.map(p => `
      <div class="pr-pin">
        <div class="pr-pin-head"><span class="n">${p.number}</span> Repère ${p.number}</div>
        <div class="pr-note">${esc(p.note || "—")}</div>
        <div class="pr-photos">${p.photos.slice(0, 4).map(ph => `<img src="${ph}" alt="">`).join("")}</div>
        ${p.photos.length > 4 ? `<div class="pr-more">+ ${p.photos.length - 4} photo(s) non imprimée(s)</div>` : ""}
      </div>`).join("")}</div>` : ""}`;
  document.body.classList.add("printing");
  const cleanup = () => { document.body.classList.remove("printing"); root.innerHTML = ""; };
  window.addEventListener("afterprint", cleanup, { once: true });
  setTimeout(() => { window.print(); setTimeout(cleanup, 1200); }, 120);
}

/* ============================================================
   Rendu global
   ============================================================ */
function renderAll() {
  renderHeader();
  renderTabs();
  if (view === "plan") renderPlanView();
  else if (view === "pins") renderPinsView();
  else renderBoardView();
}

window.addEventListener("resize", () => { if (view === "board") drawLines(); else applyZoom(); });
window.addEventListener("paste", e => {
  if (view !== "plan" || state.planImage) return;
  const file = Array.from(e.clipboardData?.files || [])[0];
  if (file) setPlanFromFile(file);
});
window.addEventListener("keydown", e => {
  if (e.key === "Escape") {
    const ov = document.querySelector(".scrim, .lightbox");
    if (ov) ov.remove();
    else if (placing) { placing = null; renderAll(); }
  }
});

renderAll();
</script>
