            padding:3mm 0 2mm 0; height:65mm; overflow:hidden;

    .photos-row { display:grid; grid-template-columns:1fr 1fr; gap:4mm; margin-top:3px; }

                 background:#F4F6F8; border:1px solid #C9D3DC; border-radius:0; }

<body>
<div id="app"></div>
<script>
const STORAGE_KEY = "releve-toiture-projet";
let state = { projectName: "Relevé de toiture", planImage: null, pins: [] };
let placing = false;
let confirmingReset = false;
let saveError = null;
let saveTimer = null;

try {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (raw) state = JSON.parse(raw);
} catch (e) {}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      saveError = null;
    } catch (e) {
      saveError = "Stockage plein. Réduis le nombre de photos.";
      renderAll();
    }
  }, 400);
}

function compressImage(file, maxWidth, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxWidth / img.width);
        const canvas = document.createElement("canvas");
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

let zoom = { s: 1, tx: 0, ty: 0 };
const MIN_S = 1, MAX_S = 8;

function applyZoom() {
  const inner = document.getElementById("planInner");
  if (!inner) return;
  const vp = document.getElementById("planViewport");
  const vw = vp.clientWidth, vh = vp.clientHeight;
  const cw = inner.offsetWidth * zoom.s, ch = inner.offsetHeight * zoom.s;
  zoom.tx = cw <= vw ? (vw - cw) / 2 : Math.min(0, Math.max(vw - cw, zoom.tx));
  zoom.ty = ch <= vh ? (vh - ch) / 2 : Math.min(0, Math.max(vh - ch, zoom.ty));
  inner.style.transform = `translate(${zoom.tx}px, ${zoom.ty}px) scale(${zoom.s})`;
  inner.querySelectorAll(".pin-marker").forEach(m => {
    m.style.transform = `translate(-50%,-50%) scale(${1 / zoom.s})`;
  });
  const lbl = document.getElementById("zoomLevel");
  if (lbl) lbl.textContent = Math.round(zoom.s * 100) + "%";
}

function zoomAt(newS, cx, cy) {
  const vp = document.getElementById("planViewport");
  if (!vp) return;
  const r = vp.getBoundingClientRect();
  const px = cx - r.left, py = cy - r.top;
  const s = Math.max(MIN_S, Math.min(MAX_S, newS));
  zoom.tx = px - ((px - zoom.tx) / zoom.s) * s;
  zoom.ty = py - ((py - zoom.ty) / zoom.s) * s;
  zoom.s = s;
  applyZoom();
}

function placePinAt(clientX, clientY) {
  const img = document.getElementById("planImg");
  if (!img) return;
  const r = img.getBoundingClientRect();
  const x = ((clientX - r.left) / r.width) * 100;
  const y = ((clientY - r.top) / r.height) * 100;
  if (x < 0 || x > 100 || y < 0 || y > 100) return;
  const id = String(Date.now());
  state.pins.push({ id, number: state.pins.length + 1, x, y, note: "", photos: [] });
  placing = false;
  scheduleSave();
  renderAll();
  setTimeout(() => document.getElementById("carte-" + id)?.scrollIntoView({ behavior: "smooth", block: "center" }), 100);
}

function setupPlanInteraction(vp) {
  const img = document.getElementById("planImg");
  if (img && !img.complete) img.onload = applyZoom;
  requestAnimationFrame(applyZoom);

  document.getElementById("zoomIn").onclick = () => {
    const r = vp.getBoundingClientRect();
    zoomAt(zoom.s * 1.5, r.left + r.width / 2, r.top + r.height / 2);
  };
  document.getElementById("zoomOut").onclick = () => {
    const r = vp.getBoundingClientRect();
    zoomAt(zoom.s / 1.5, r.left + r.width / 2, r.top + r.height / 2);
  };
  document.getElementById("zoomReset").onclick = () => {
    zoom = { s: 1, tx: 0, ty: 0 };
    applyZoom();
  };

  let pts = new Map(), startDist = 0, startS = 1, startMid = null;
  let panStart = null, moved = 0;

  vp.addEventListener("pointerdown", (e) => {
    vp.setPointerCapture(e.pointerId);
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    moved = 0;
    if (pts.size === 1) {
      panStart = { x: e.clientX, y: e.clientY, tx: zoom.tx, ty: zoom.ty };
    } else if (pts.size === 2) {
      const [a, b] = [...pts.values()];
      startDist = Math.hypot(a.x - b.x, a.y - b.y);
      startS = zoom.s;
      startMid = { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 };
      panStart = null;
    }
  });

  vp.addEventListener("pointermove", (e) => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && startDist) {
      const [a, b] = [...pts.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      moved = 99;
      zoomAt(startS * (d / startDist), startMid.x, startMid.y);
    } else if (pts.size === 1 && panStart && zoom.s > 1) {
      const dx = e.clientX - panStart.x, dy = e.clientY - panStart.y;
      moved = Math.max(moved, Math.hypot(dx, dy));
      zoom.tx = panStart.tx + dx;
      zoom.ty = panStart.ty + dy;
      applyZoom();
    }
  });

  const endPointer = (e) => {
    const wasSingle = pts.size === 1;
    pts.delete(e.pointerId);
    if (pts.size === 0) {
      if (wasSingle && moved < 8) {
        const target = e.target.closest("[data-scroll]");
        if (target && !placing) {
          document.getElementById("carte-" + target.dataset.scroll)
            ?.scrollIntoView({ behavior: "smooth", block: "center" });
        } else if (placing) {
          placePinAt(e.clientX, e.clientY);
        }
      }
      panStart = null; startDist = 0;
    }
  };
  vp.addEventListener("pointerup", endPointer);
  vp.addEventListener("pointercancel", (e) => { pts.delete(e.pointerId); panStart = null; startDist = 0; });

  vp.addEventListener("wheel", (e) => {
    e.preventDefault();
    zoomAt(zoom.s * (e.deltaY < 0 ? 1.15 : 1 / 1.15), e.clientX, e.clientY);
  }, { passive: false });
}

let boardMode = false;

function loadImg(src) {
  return new Promise((res, rej) => {
    const i = new Image();
    i.onload = () => res(i);
    i.onerror = rej;
    i.src = src;
  });
}

function drawCover(ctx, img, x, y, w, h) {
  const ar = img.width / img.height, dr = w / h;
  let sw, sh, sx, sy;
  if (ar > dr) { sh = img.height; sw = sh * dr; sx = (img.width - sw) / 2; sy = 0; }
  else { sw = img.width; sh = sw / dr; sx = 0; sy = (img.height - sh) / 2; }
  ctx.drawImage(img, sx, sy, sw, sh, x, y, w, h);
}

function wrapText(ctx, text, maxW, maxLines) {
  const words = String(text).split(/\s+/);
  const lines = [];
  let cur = "";
  for (const w of words) {
    const t = cur ? cur + " " + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; if (lines.length === maxLines) break; }
    else cur = t;
  }
  if (lines.length < maxLines && cur) lines.push(cur);
  if (lines.length === maxLines && ctx.measureText(cur).width > maxW) {
    while (lines[maxLines - 1].length > 3 && ctx.measureText(lines[maxLines - 1] + "…").width > maxW) {
      lines[maxLines - 1] = lines[maxLines - 1].slice(0, -1);
    }
    lines[maxLines - 1] += "…";
  }
  return lines;
}

async function exportPNG() {
  const btn = document.getElementById("boardExport");
  const board = document.getElementById("board");
  const planEl = document.getElementById("boardImg");
  if (!board || !planEl) return;
  btn.disabled = true;
  btn.textContent = "Génération…";

  try {
    const S = 2;
    const br = board.getBoundingClientRect();
    const canvas = document.createElement("canvas");
    canvas.width = Math.round(br.width * S);
    canvas.height = Math.round(br.height * S);
    const ctx = canvas.getContext("2d");
    ctx.scale(S, S);
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, br.width, br.height);
    ctx.textBaseline = "top";

    const head = board.querySelector(".board-head");
    if (head) {
      const hr = head.getBoundingClientRect();
      ctx.textAlign = "center";
      ctx.fillStyle = "#10233F";
      ctx.font = "700 20px -apple-system, Helvetica, Arial, sans-serif";
      ctx.fillText(state.projectName, br.width / 2, hr.top - br.top);
      const nb = state.pins.filter(p => p.photos.length).length;
      ctx.fillStyle = "#5A6672";
      ctx.font = "11px -apple-system, Helvetica, Arial, sans-serif";
      const d = new Date().toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" });
      ctx.fillText(`Relevé de toiture · ${nb} désordre${nb !== 1 ? "s" : ""} localisé${nb !== 1 ? "s" : ""} · ${d}`, br.width / 2, hr.top - br.top + 26);
      ctx.textAlign = "left";
    }

    const pr = planEl.getBoundingClientRect();
    const planImg = await loadImg(state.planImage);
    ctx.drawImage(planImg, pr.left - br.left, pr.top - br.top, pr.width, pr.height);
    ctx.strokeStyle = "#94A3B0";
    ctx.lineWidth = 1;
    ctx.strokeRect(pr.left - br.left, pr.top - br.top, pr.width, pr.height);

    const cards = [...document.querySelectorAll("[data-card]")];
    for (const card of cards) {
      const pin = state.pins.find(p => p.id === card.dataset.card);
      if (!pin) continue;
      const cr = card.getBoundingClientRect();
      const x = cr.left - br.left, y = cr.top - br.top;

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(x, y, cr.width, cr.height);

      const imgEl = card.querySelector("img");
      const ir = imgEl.getBoundingClientRect();
      const photo = await loadImg(pin.photos[0]);
      drawCover(ctx, photo, ir.left - br.left, ir.top - br.top, ir.width, ir.height);

      const capEl = card.querySelector(".cap");
      if (capEl) {
        const car = capEl.getBoundingClientRect();
        ctx.fillStyle = "#334155";
        ctx.font = "10px -apple-system, Helvetica, Arial, sans-serif";
        const extra = pin.photos.length > 1 ? ` (+${pin.photos.length - 1})` : "";
        const lines = wrapText(ctx, (pin.note || "Désordre relevé") + extra, cr.width - 10, 2);
        lines.forEach((l, i) => ctx.fillText(l, car.left - br.left + 4, car.top - br.top + 2 + i * 12));
      }

      ctx.strokeStyle = "#F2C230";
      ctx.lineWidth = 3;
      ctx.strokeRect(x + 1.5, y + 1.5, cr.width - 3, cr.height - 3);
    }

    ctx.lineCap = "round";
    for (const card of cards) {
      const pin = state.pins.find(p => p.id === card.dataset.card);
      if (!pin) continue;
      const cr = card.getBoundingClientRect();
      const tx = pr.left - br.left + (pin.x / 100) * pr.width;
      const ty = pr.top - br.top + (pin.y / 100) * pr.height;
      const cxMid = cr.left - br.left + cr.width / 2;
      const cyMid = cr.top - br.top + cr.height / 2;
      let sx, sy;
      if (cr.bottom <= pr.top + 2) { sx = cxMid; sy = cr.bottom - br.top; }
      else if (cr.top >= pr.bottom - 2) { sx = cxMid; sy = cr.top - br.top; }
      else if (cr.right <= pr.left + 2) { sx = cr.right - br.left; sy = cyMid; }
      else { sx = cr.left - br.left; sy = cyMid; }

      const mx = (sx + tx) / 2, my = (sy + ty) / 2;
      const nx = -(ty - sy), ny = tx - sx;
      const len = Math.hypot(nx, ny) || 1;
      const bow = Math.min(38, len * 0.12);
      const qx = mx + (nx / len) * bow, qy = my + (ny / len) * bow;

      ctx.strokeStyle = "#F2C230";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.quadraticCurveTo(qx, qy, tx, ty);
      ctx.stroke();

      const ang = Math.atan2(ty - qy, tx - qx);
      ctx.fillStyle = "#F2C230";
      ctx.beginPath();
      ctx.moveTo(tx, ty);
      ctx.lineTo(tx - 11 * Math.cos(ang - 0.4), ty - 11 * Math.sin(ang - 0.4));
      ctx.lineTo(tx - 11 * Math.cos(ang + 0.4), ty - 11 * Math.sin(ang + 0.4));
      ctx.closePath();
      ctx.fill();
    }

    for (const pin of state.pins) {
      const dx = pr.left - br.left + (pin.x / 100) * pr.width;
      const dy = pr.top - br.top + (pin.y / 100) * pr.height;
      ctx.beginPath();
      ctx.arc(dx, dy, 7, 0, Math.PI * 2);
      ctx.fillStyle = "#E8622C";
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();
    }

    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (const card of cards) {
      const pin = state.pins.find(p => p.id === card.dataset.card);
      if (!pin) continue;
      const cr = card.getBoundingClientRect();
      const bx = cr.left - br.left + 2, by = cr.top - br.top + 2;
      ctx.beginPath();
      ctx.arc(bx, by, 11, 0, Math.PI * 2);
      ctx.fillStyle = "#E8622C";
      ctx.fill();
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.font = "700 12px ui-monospace, Menlo, monospace";
      ctx.fillText(String(pin.number), bx, by + 0.5);
    }
    ctx.textAlign = "left";
    ctx.textBaseline = "top";

    const url = canvas.toDataURL("image/png");
    showExport(url);
  } catch (e) {
    alert("Échec de la génération : " + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = "Exporter en PNG";
  }
}

function showExport(url) {
  const name = (state.projectName || "planche").replace(/[^\w\-]+/g, "_") + ".png";
  const ov = document.createElement("div");
  ov.className = "export-overlay";
  ov.innerHTML = `
    <div class="export-box">
      <div class="export-head">
        <strong>Planche générée</strong>
        <button class="export-close">✕</button>
      </div>
      <p class="export-hint">Appui long sur l'image → « Ajouter aux photos », ou utilise le bouton ci-dessous.</p>
      <img src="${url}" class="export-img">
      <a class="btn btn-accent" href="${url}" download="${name}" style="text-decoration:none">Enregistrer le fichier</a>
    </div>`;
  ov.querySelector(".export-close").onclick = () => ov.remove();
  ov.onclick = (e) => { if (e.target === ov) ov.remove(); };
  document.body.appendChild(ov);
}

function assignEdges() {
  const withPhoto = state.pins.filter(p => p.photos.length > 0);
  const edges = { top: [], bottom: [], left: [], right: [] };
  const cap = { top: 7, bottom: 7, left: 4, right: 4 };
  withPhoto.forEach(p => {
    const d = { top: p.y, bottom: 100 - p.y, left: p.x, right: 100 - p.x };
    const order = Object.keys(d).sort((a, b) => d[a] - d[b]);
    let placed = false;
    for (const e of order) {
      if (edges[e].length < cap[e]) { edges[e].push(p); placed = true; break; }
    }
    if (!placed) edges[order[0]].push(p);
  });
  edges.top.sort((a, b) => a.x - b.x);
  edges.bottom.sort((a, b) => a.x - b.x);
  edges.left.sort((a, b) => a.y - b.y);
  edges.right.sort((a, b) => a.y - b.y);
  return edges;
}

function photoCard(p) {
  const extra = p.photos.length > 1 ? ` (+${p.photos.length - 1})` : "";
  return `<div class="ph-card" data-card="${p.id}">
    <div class="num">${p.number}</div>
    <img src="${p.photos[0]}" alt="">
    <div class="cap">${(p.note || "Désordre relevé")}${extra}</div>
  </div>`;
}

function renderBoard() {
  const edges = assignEdges();
  const dots = state.pins.map(p =>
    `<div class="board-dot" data-dot="${p.id}" style="left:${p.x}%;top:${p.y}%"></div>`
  ).join("");
  const nb = state.pins.filter(p => p.photos.length).length;

  document.getElementById("app").innerHTML = `
    <div class="board-screen">
      <div class="board-toolbar no-print">
        <button class="btn btn-outline" id="backBtn" style="flex:none">← Retour</button>
        <button class="btn btn-accent" id="boardExport">Exporter en PNG</button>
      </div>
      <div class="board-scroll">
        <div class="board" id="board">
          <div class="board-head">
            <h2>${state.projectName}</h2>
            <div class="meta">Relevé de toiture · ${nb} désordre${nb !== 1 ? "s" : ""} localisé${nb !== 1 ? "s" : ""} · ${new Date().toLocaleDateString("fr-FR", { day: "2-digit", month: "long", year: "numeric" })}</div>
          </div>
          <div class="edge-row top" id="edgeTop">${edges.top.map(photoCard).join("")}</div>
          <div class="board-mid">
            <div class="edge-col" id="edgeLeft">${edges.left.map(photoCard).join("")}</div>
            <div class="board-plan" id="boardPlan">
              <img src="${state.planImage}" id="boardImg" alt="Plan">
              ${dots}
            </div>
            <div class="edge-col" id="edgeRight">${edges.right.map(photoCard).join("")}</div>
          </div>
          <div class="edge-row bottom" id="edgeBottom">${edges.bottom.map(photoCard).join("")}</div>
          <svg class="board-lines" id="boardLines"></svg>
        </div>
      </div>
      ${nb === 0 ? `<div class="board-empty">Ajoute au moins une photo à un repère pour générer la planche.</div>` : ""}
    </div>`;

  document.getElementById("backBtn").onclick = () => { boardMode = false; renderAll(); };
  document.getElementById("boardExport").onclick = exportPNG;

  const img = document.getElementById("boardImg");
  if (img && !img.complete) img.onload = drawLines;
  requestAnimationFrame(() => requestAnimationFrame(drawLines));
  window.onresize = () => { if (boardMode) drawLines(); };
}

function drawLines() {
  const board = document.getElementById("board");
  const svg = document.getElementById("boardLines");
  const plan = document.getElementById("boardImg");
  if (!board || !svg || !plan) return;

  const br = board.getBoundingClientRect();
  const pr = plan.getBoundingClientRect();
  svg.setAttribute("viewBox", `0 0 ${br.width} ${br.height}`);
  svg.setAttribute("width", br.width);
  svg.setAttribute("height", br.height);

  let paths = `<defs><marker id="ah" markerWidth="7" markerHeight="7" refX="6" refY="3.5"
      orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#F2C230" stroke="#8A6D00" stroke-width="0.5"/></marker></defs>`;

  document.querySelectorAll("[data-card]").forEach(card => {
    const pin = state.pins.find(p => p.id === card.dataset.card);
    if (!pin) return;
    const cr = card.getBoundingClientRect();

    const tx = pr.left - br.left + (pin.x / 100) * pr.width;
    const ty = pr.top - br.top + (pin.y / 100) * pr.height;
    const cxMid = cr.left - br.left + cr.width / 2;
    const cyMid = cr.top - br.top + cr.height / 2;

    let sx, sy;
    if (cr.bottom <= pr.top + 2) { sx = cxMid; sy = cr.bottom - br.top; }
    else if (cr.top >= pr.bottom - 2) { sx = cxMid; sy = cr.top - br.top; }
    else if (cr.right <= pr.left + 2) { sx = cr.right - br.left; sy = cyMid; }
    else { sx = cr.left - br.left; sy = cyMid; }

    const mx = (sx + tx) / 2, my = (sy + ty) / 2;
    const nx = -(ty - sy), ny = tx - sx;
    const len = Math.hypot(nx, ny) || 1;
    const bow = Math.min(38, len * 0.12);
    const qx = mx + (nx / len) * bow, qy = my + (ny / len) * bow;

    paths += `<path d="M ${sx} ${sy} Q ${qx} ${qy} ${tx} ${ty}" fill="none"
      stroke="#F2C230" stroke-width="4" stroke-linecap="round"
      marker-end="url(#ah)" opacity="0.95"/>`;
  });

  svg.innerHTML = paths;
}

function renderAll() {
  if (boardMode && state.planImage) { renderBoard(); return; }
  const app = document.getElementById("app");
  const pinsMarkers = state.pins.map(p =>
    `<div class="pin-marker" style="left:${p.x}%;top:${p.y}%" data-scroll="${p.id}">${p.number}</div>`
  ).join("");

  const planSection = !state.planImage ? `
    <label class="upload-zone no-print">
      <div class="title">Importer le plan de toiture</div>
      <div class="hint">Photo ou capture d'écran du plan</div>
      <input type="file" accept="image/*" id="planInput" style="display:none">
    </label>` : `
    <div class="plan-viewport" id="planViewport">
      <div class="plan-inner" id="planInner">
        <img src="${state.planImage}" alt="Plan" id="planImg">
        ${pinsMarkers}
      </div>
      ${placing ? `<div class="placing-banner">Touche le plan à l'endroit du désordre</div>` : ""}
    </div>
    <div class="zoom-bar no-print">
      <button class="zoom-btn" id="zoomOut">−</button>
      <span class="zoom-level" id="zoomLevel">100%</span>
      <button class="zoom-btn" id="zoomIn">+</button>
      <button class="zoom-btn" id="zoomReset" style="font-size:14px">↺</button>
      <span class="zoom-hint">Pince pour zoomer<br>1 doigt pour déplacer</span>
    </div>
    <div class="actions-row no-print">
      <button class="btn ${placing ? "btn-placing" : "btn-accent"}" id="placeBtn">${placing ? "Annuler" : "+ Ajouter un repère"}</button>
      <button class="btn btn-outline" id="boardBtn">Planche</button>
    </div>`;

  const cards = state.pins.map(p => `
    <div class="card" id="carte-${p.id}">
      <div class="card-head">
        <div class="card-title"><span class="badge">${p.number}</span> Repère ${p.number}</div>
        <button class="del-btn no-print" data-del="${p.id}">✕</button>
      </div>
      <textarea class="note-input no-print" rows="2" placeholder="Description du désordre…" data-note="${p.id}">${p.note}</textarea>
      <p class="print-note">${p.note || "—"}</p>
      <div class="photos-row">
        ${p.photos.map((ph, idx) => `
          <div class="thumb">
            <img src="${ph}">
            <button class="rm no-print" data-rmphoto="${p.id}" data-idx="${idx}">✕</button>
          </div>`).join("")}
        <label class="add-photo no-print">📷
          <input type="file" accept="image/*" capture="environment" multiple data-photoinput="${p.id}">
        </label>
      </div>
    </div>`).join("");

  app.innerHTML = `
    <div class="topbar no-print">
      <div class="topbar-row">
        <div style="flex:1;min-width:0;">
          <input id="nameInput" value="${state.projectName}">
          <div class="sub">${state.pins.length} repère${state.pins.length !== 1 ? "s" : ""} · sauvegardé sur cet appareil</div>
        </div>
        ${!confirmingReset ? `<button class="icon-btn" id="resetBtn">↺</button>` : `
          <div class="confirm-row">
            <button class="mini-btn" style="background:#E8622C" id="confirmYes">Confirmer</button>
            <button class="mini-btn" style="background:rgba(255,255,255,0.15)" id="confirmNo">Annuler</button>
          </div>`}
      </div>
    </div>
    ${saveError ? `<div class="save-error no-print">${saveError}</div>` : ""}
    <div class="content">
      <div class="print-header">
        <h1>${state.projectName}</h1>
        <div class="meta">Rapport photo · ${state.pins.length} repère${state.pins.length !== 1 ? "s" : ""} · ${new Date().toLocaleDateString("fr-FR", { day:"2-digit", month:"long", year:"numeric" })}</div>
      </div>
      ${planSection}
      ${state.planImage ? `<div class="print-legend">Plan de toiture — localisation des désordres relevés</div>` : ""}
      <div class="cards-zone" style="margin-top:14px;">${cards}</div>
    </div>`;

  attachListeners();
}

function attachListeners() {
  const nameInput = document.getElementById("nameInput");
  if (nameInput) nameInput.oninput = (e) => { state.projectName = e.target.value; scheduleSave(); };

  const resetBtn = document.getElementById("resetBtn");
  if (resetBtn) resetBtn.onclick = () => { confirmingReset = true; renderAll(); };
  const confirmYes = document.getElementById("confirmYes");
  if (confirmYes) confirmYes.onclick = () => {
    state = { projectName: "Relevé de toiture", planImage: null, pins: [] };
    confirmingReset = false;
    scheduleSave();
    renderAll();
  };
  const confirmNo = document.getElementById("confirmNo");
  if (confirmNo) confirmNo.onclick = () => { confirmingReset = false; renderAll(); };

  const planInput = document.getElementById("planInput");
  if (planInput) planInput.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    state.planImage = await compressImage(file, 1200, 0.7);
    scheduleSave();
    renderAll();
  };

  const viewport = document.getElementById("planViewport");
  if (viewport) setupPlanInteraction(viewport);

  const placeBtn = document.getElementById("placeBtn");
  if (placeBtn) placeBtn.onclick = () => { placing = !placing; renderAll(); };

  const boardBtn = document.getElementById("boardBtn");
  if (boardBtn) boardBtn.onclick = () => { boardMode = true; renderAll(); };

  document.querySelectorAll("[data-del]").forEach(btn => {
    btn.onclick = () => {
      state.pins = state.pins.filter(p => p.id !== btn.dataset.del).map((p, i) => ({ ...p, number: i + 1 }));
      scheduleSave();
      renderAll();
    };
  });

  document.querySelectorAll("[data-note]").forEach(ta => {
    ta.oninput = () => {
      const pin = state.pins.find(p => p.id === ta.dataset.note);
      if (pin) { pin.note = ta.value; scheduleSave(); }
    };
  });

  document.querySelectorAll("[data-photoinput]").forEach(input => {
    input.onchange = async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;
      const compressed = await Promise.all(files.map(f => compressImage(f, 700, 0.55)));
      const pin = state.pins.find(p => p.id === input.dataset.photoinput);
      if (pin) { pin.photos.push(...compressed); scheduleSave(); renderAll(); }
    };
  });

  document.querySelectorAll("[data-rmphoto]").forEach(btn => {
    btn.onclick = () => {
      const pin = state.pins.find(p => p.id === btn.dataset.rmphoto);
      if (pin) { pin.photos.splice(Number(btn.dataset.idx), 1); scheduleSave(); renderAll(); }
    };
  });
}

renderAll();
</script>
</body>
</html>
